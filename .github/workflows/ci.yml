name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-lint-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv tool install ruff==0.15.12 --with ruff

      - name: Ruff check
        run: ruff check

      - name: Ruff format check
        run: ruff format --check

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Typos check
        uses: crate-ci/typos@v1
        with:
          config: pyproject.toml

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Pure tests (no external deps needed)
        run: |
          uv venv
          uv pip install pytest
          PYTHONPATH=. uv run pytest tests/unit/test_pure.py tests/unit/test_point_to_line_distance.py tests/unit/test_point_to_line_distance_properties.py tests/unit/test_config_data.py tests/unit/test_constants.py tests/unit/test_color_rule.py -v

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-typecheck-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv venv && uv pip install pyright ty wxPython pydantic

      - name: ty
        run: PYTHONPATH=. uv run ty check

      - name: pyright
        run: PYTHONPATH=. uv run pyright kicad_dfm/utils/pure.py tests/unit/test_pure.py tests/unit/test_point_to_line_distance.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv venv && uv pip install mkdocs mkdocs-material

      - name: Build docs
        run: uv run mkdocs build --strict

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev

      - name: Install dependencies
        run: |
          uv venv
          uv pip install pytest wxPython pydantic

      - name: Run tests
        run: PYTHONPATH=. uv run pytest -v

      - name: Minimize uv cache
        run: uv cache prune --ci
