repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # Tip: keep in sync with Makefile and `.github/workflows/ci.yml`
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/crate-ci/typos
    rev: v1.41.0
    hooks:
      - id: typos
  # pyright is run via `make typecheck` and CI (separate job);
  # omitted from pre-commit because the root __init__.py (KiCad loader)
  # breaks pyright's module resolution of the entire tree.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false
